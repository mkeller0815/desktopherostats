<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desktop Heroes Save File Viewer</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4a7c59 0%, #2d5a3d 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo {
            max-width: 400px;
            width: 100%;
            height: auto;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .upload-section {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px;
            border: 3px dashed #6b9b7a;
            border-radius: 10px;
            background: #f5f9f6;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            border-color: #4a7c59;
            background: #edf5ef;
        }

        .upload-section.drag-over {
            border-color: #4a7c59;
            background: #e3f2e7;
            transform: scale(1.02);
        }

        .file-input-wrapper {
            display: inline-block;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #4a7c59 0%, #2d5a3d 100%);
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-input-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 124, 89, 0.4);
        }

        .file-name {
            margin-top: 15px;
            color: #666;
            font-style: italic;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            border-left: 4px solid #c33;
        }

        .results {
            display: none;
        }

        .results.visible {
            display: block;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            color: #4a7c59;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #4a7c59;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #4a7c59 0%, #2d5a3d 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .stat-card .hero-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 10px;
            display: block;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
        }

        .map-icon {
            width: 24px;
            height: 24px;
            display: inline-block;
            vertical-align: middle;
            margin-right: 5px;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        .map-separator .map-icon {
            width: 32px;
            height: 32px;
            margin-right: 8px;
            vertical-align: middle;
        }

        /* Map detail modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            overflow: auto;
        }

        .modal.active {
            display: block;
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 900px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            transition: color 0.3s;
        }

        .modal-close:hover {
            color: #4a7c59;
        }

        .modal-header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 3px solid #4a7c59;
        }

        .modal-header .map-icon {
            width: 48px;
            height: 48px;
            margin-right: 15px;
        }

        .modal-header h2 {
            color: #4a7c59;
            margin: 0;
            font-size: 2em;
        }

        .map-link {
            color: inherit;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.3s;
        }

        .map-link:hover {
            color: #4a7c59;
        }

        .stat-card h3 {
            font-size: 1.1em;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
        }

        .table-wrapper {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        th {
            background: linear-gradient(135deg, #4a7c59 0%, #2d5a3d 100%);
            color: white;
            padding: 15px 10px;
            text-align: center;
            font-weight: bold;
            border: 1px solid #3d6b4d;
        }

        th.map-header {
            text-align: left;
            padding-left: 20px;
        }

        td {
            padding: 12px 10px;
            text-align: center;
            border: 1px solid #ddd;
        }

        td.map-name {
            text-align: left;
            padding-left: 20px;
            font-weight: bold;
            color: #333;
        }

        .map-link {
            color: #4a7c59;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .map-link:hover {
            color: #2d5a3d;
            text-decoration: underline;
        }

        tr:nth-child(even) {
            background: #f5f9f6;
        }

        tr:hover {
            background: #e3f2e7;
        }

        .hero-group {
            border-left: 2px solid #4a7c59;
        }

        td.kills-col {
            background: rgba(74, 124, 89, 0.05);
        }

        th.kills-col {
            background: linear-gradient(135deg, #4a7c59 0%, #2d5a3d 100%);
        }

        /* Comparison styles */
        .comparison-value {
            display: inline-block;
        }

        .old-value {
            color: #666;
            font-size: 0.85em;
            margin-right: 4px;
        }

        .value-increased {
            color: #2d8659;
            font-weight: bold;
        }

        .value-decreased {
            color: #c9302c;
            font-weight: bold;
        }

        .value-unchanged {
            color: #333;
        }

        .upload-slots {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .upload-slot {
            flex: 1;
            min-width: 250px;
            max-width: 400px;
        }

        .upload-slot h3 {
            color: #4a7c59;
            margin-bottom: 10px;
            text-align: center;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #4a7c59;
        }

        .tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: #4a7c59;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            position: relative;
            bottom: -2px;
        }

        .tab:hover {
            background: rgba(74, 124, 89, 0.1);
        }

        .tab.active {
            color: #2d5a3d;
            border-bottom-color: #2d5a3d;
            background: rgba(45, 90, 61, 0.05);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .map-separator {
            background: linear-gradient(135deg, #4a7c59 0%, #2d5a3d 100%);
            color: white;
            font-weight: bold;
            text-align: left;
            padding: 10px 20px !important;
            font-size: 1.1em;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.8em;
            }

            .upload-section {
                padding: 20px;
            }

            table {
                font-size: 0.9em;
            }

            th, td {
                padding: 8px 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="assets/logo_desktop_heroes.png" alt="Desktop Heroes" class="logo">
        </div>
        <h1>Save File Viewer</h1>

        <div class="upload-section">
            <div class="upload-slots">
                <div class="upload-slot">
                    <h3>Current Save</h3>
                    <div id="uploadSection1" class="upload-section" style="padding: 20px;">
                        <div class="file-input-wrapper">
                            <input type="file" id="fileInput1" accept=".pxt" />
                            <label for="fileInput1" class="file-input-label">Choose File</label>
                        </div>
                        <div class="file-name" id="fileName1">or drag and drop</div>
                    </div>
                </div>
                <div class="upload-slot">
                    <h3>Previous Save (Optional)</h3>
                    <div id="uploadSection2" class="upload-section" style="padding: 20px;">
                        <div class="file-input-wrapper">
                            <input type="file" id="fileInput2" accept=".pxt" />
                            <label for="fileInput2" class="file-input-label">Choose File</label>
                        </div>
                        <div class="file-name" id="fileName2">or drag and drop</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="error"></div>

        <div class="results" id="results">
            <div class="section">
                <h2>Character Overview</h2>
                <div class="stats-grid" id="levelsGrid"></div>
            </div>

            <div class="section">
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('mapProgress')">Map Progress</button>
                    <button class="tab" onclick="switchTab('killStatsRegular')">Regular Mobs</button>
                    <button class="tab" onclick="switchTab('killStatsBosses')">Bosses</button>
                </div>

                <div id="mapProgress" class="tab-content active">
                    <div class="table-wrapper">
                        <table id="mapTable">
                            <thead id="tableHead"></thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </div>

                <div id="killStatsRegular" class="tab-content">
                    <div class="table-wrapper">
                        <table id="killStatsRegularTable">
                            <thead id="killStatsRegularHead"></thead>
                            <tbody id="killStatsRegularBody"></tbody>
                        </table>
                    </div>
                </div>

                <div id="killStatsBosses" class="tab-content">
                    <div class="table-wrapper">
                        <table id="killStatsBossesTable">
                            <thead id="killStatsBossesHead"></thead>
                            <tbody id="killStatsBossesBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Map Detail Modal -->
    <div id="mapModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeMapModal()">&times;</span>
            <div class="modal-header">
                <div id="modalMapIcon"></div>
                <h2 id="modalMapName"></h2>
            </div>
            <div id="modalMapStats"></div>
        </div>
    </div>

    <script>
        const heroes = ['edric', 'serewyn', 'corin', 'alaric'];
        let globalMapData = null; // Store map data for modal access

        // Tab switching function
        function switchTab(tabName) {
            // Hide all tab contents
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });

            // Remove active class from all tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // Show selected tab content
            document.getElementById(tabName).classList.add('active');

            // Add active class to clicked tab
            event.target.classList.add('active');
        }

        // Modal functions
        function showMapDetails(mapName) {
            if (!globalMapData) return;

            const modal = document.getElementById('mapModal');
            const modalMapName = document.getElementById('modalMapName');
            const modalMapIcon = document.getElementById('modalMapIcon');
            const modalMapStats = document.getElementById('modalMapStats');

            // Set map name and icon
            const mapNameCap = mapName.charAt(0).toUpperCase() + mapName.slice(1);
            modalMapName.textContent = mapNameCap;
            modalMapIcon.innerHTML = getMapIcon(mapName);

            // Build stats table with heroes as columns
            let tableHTML = '<table class="stats-table" style="width: 100%; margin-top: 20px;"><thead><tr>';
            tableHTML += '<th style="text-align: left;">Stat</th>';

            heroes.forEach(hero => {
                const heroName = hero.charAt(0).toUpperCase() + hero.slice(1);
                const heroIcon = getHeroIcon(hero);
                tableHTML += `<th>${heroIcon} ${heroName}</th>`;
            });
            tableHTML += '</tr></thead><tbody>';

            // Difficulty row
            tableHTML += '<tr><td><strong>Difficulty</strong></td>';
            heroes.forEach(hero => {
                const difficulty = globalMapData[hero][mapName]?.difficulty || 0;
                tableHTML += `<td>${difficulty}</td>`;
            });
            tableHTML += '</tr>';

            // Distance row
            tableHTML += '<tr><td><strong>Distance</strong></td>';
            heroes.forEach(hero => {
                const distance = globalMapData[hero][mapName]?.distance || 0;
                tableHTML += `<td>${distance.toLocaleString()}</td>`;
            });
            tableHTML += '</tr>';

            // Max Level row
            tableHTML += '<tr><td><strong>Max Level</strong></td>';
            heroes.forEach(hero => {
                const maxLevel = globalMapData[hero][mapName]?.maxLevel || 0;
                tableHTML += `<td>${maxLevel}</td>`;
            });
            tableHTML += '</tr>';

            // Kill Count row
            tableHTML += '<tr><td><strong>Kill Count</strong></td>';
            heroes.forEach(hero => {
                const kills = globalMapData[hero][mapName]?.killCount || 0;
                tableHTML += `<td>${kills.toLocaleString()}</td>`;
            });
            tableHTML += '</tr>';

            // Further Kill Count row
            tableHTML += '<tr><td><strong>Further Kills</strong></td>';
            heroes.forEach(hero => {
                const furtherKills = globalMapData[hero][mapName]?.furtherKillCount || 0;
                tableHTML += `<td>${furtherKills.toLocaleString()}</td>`;
            });
            tableHTML += '</tr>';

            // Total Kill Count row
            tableHTML += '<tr><td><strong>Total Kills</strong></td>';
            heroes.forEach(hero => {
                const totalKills = globalMapData[hero][mapName]?.totalKillCount || 0;
                tableHTML += `<td>${totalKills.toLocaleString()}</td>`;
            });
            tableHTML += '</tr>';

            tableHTML += '</tbody></table>';
            modalMapStats.innerHTML = tableHTML;

            // Show modal
            modal.style.display = 'block';
        }

        function closeMapModal() {
            document.getElementById('mapModal').style.display = 'none';
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('mapModal');
            if (event.target === modal) {
                closeMapModal();
            }
        }

        // File upload handling
        const fileInput1 = document.getElementById('fileInput1');
        const fileInput2 = document.getElementById('fileInput2');
        const uploadSection1 = document.getElementById('uploadSection1');
        const uploadSection2 = document.getElementById('uploadSection2');
        const fileName1 = document.getElementById('fileName1');
        const fileName2 = document.getElementById('fileName2');
        const errorDiv = document.getElementById('error');
        const resultsDiv = document.getElementById('results');

        let currentData = null;
        let previousData = null;

        fileInput1.addEventListener('change', (e) => handleFileSelect(e, 1));
        fileInput2.addEventListener('change', (e) => handleFileSelect(e, 2));

        // Drag and drop for first upload
        uploadSection1.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection1.classList.add('drag-over');
        });

        uploadSection1.addEventListener('dragleave', () => {
            uploadSection1.classList.remove('drag-over');
        });

        uploadSection1.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection1.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0], 1);
            }
        });

        // Drag and drop for second upload
        uploadSection2.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection2.classList.add('drag-over');
        });

        uploadSection2.addEventListener('dragleave', () => {
            uploadSection2.classList.remove('drag-over');
        });

        uploadSection2.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection2.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0], 2);
            }
        });

        function handleFileSelect(e, slot) {
            const file = e.target.files[0];
            if (file) {
                handleFile(file, slot);
            }
        }

        function handleFile(file, slot) {
            const fileNameEl = slot === 1 ? fileName1 : fileName2;
            fileNameEl.textContent = `Loading: ${file.name}`;
            errorDiv.innerHTML = '';

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const base64Data = e.target.result;
                    const jsonString = atob(base64Data);
                    const data = JSON.parse(jsonString);

                    fileNameEl.textContent = `Loaded: ${file.name}`;

                    if (slot === 1) {
                        currentData = data;
                    } else {
                        previousData = data;
                    }

                    if (currentData) {
                        processData(currentData, previousData);
                    }
                } catch (err) {
                    showError(`Error processing file ${slot}: ${err.message}`);
                    fileNameEl.textContent = 'or drag and drop';
                }
            };
            reader.onerror = function() {
                showError(`Error reading file ${slot}`);
                fileNameEl.textContent = 'or drag and drop';
            };
            reader.readAsText(file);
        }

        function showError(message) {
            errorDiv.innerHTML = `<div class="error">${message}</div>`;
        }

        function formatComparisonValue(currentValue, previousValue, isNumeric = true) {
            if (previousValue === null || previousValue === undefined) {
                return isNumeric ? currentValue.toLocaleString() : currentValue;
            }

            const current = isNumeric ? currentValue : parseFloat(currentValue) || 0;
            const previous = isNumeric ? previousValue : parseFloat(previousValue) || 0;

            let colorClass = 'value-unchanged';
            if (current > previous) {
                colorClass = 'value-increased';
            } else if (current < previous) {
                colorClass = 'value-decreased';
            }

            const displayCurrent = isNumeric ? current.toLocaleString() : current;
            const displayPrevious = isNumeric ? previous.toLocaleString() : previous;

            if (current === previous) {
                return displayCurrent;
            }

            return `<span class="comparison-value"><span class="old-value">(${displayPrevious})</span><span class="${colorClass}">${displayCurrent}</span></span>`;
        }

        function processData(data, previousDataParam = null) {
            try {
                const levels = extractCharacterLevels(data);
                const mapData = extractMapData(data);
                const totalKills = extractTotalKills(data);
                const killStats = extractKillStats(data);

                let prevLevels = null;
                let prevMapData = null;
                let prevTotalKills = null;

                if (previousDataParam) {
                    prevLevels = extractCharacterLevels(previousDataParam);
                    prevMapData = extractMapData(previousDataParam);
                    prevTotalKills = extractTotalKills(previousDataParam);
                }

                // Store mapData globally for modal access
                globalMapData = mapData;

                displayResults(levels, mapData, totalKills, killStats, prevLevels, prevMapData, prevTotalKills);
                resultsDiv.classList.add('visible');
            } catch (err) {
                showError(`Error extracting data: ${err.message}`);
            }
        }

        function extractCharacterLevels(data) {
            const levels = {};
            if (data.gameStore && data.gameStore.characters) {
                heroes.forEach(hero => {
                    const charKey = `char_${hero}`;
                    if (data.gameStore.characters[charKey]) {
                        const charData = data.gameStore.characters[charKey];
                        levels[hero] = {
                            level: charData.level || 0,
                            location: charData.location || 'Unknown'
                        };
                    } else {
                        levels[hero] = {
                            level: 0,
                            location: 'Unknown'
                        };
                    }
                });
            }
            return levels;
        }

        function extractMapData(data) {
            const mapData = {};
            if (data.progressStore && data.progressStore.map) {
                heroes.forEach(hero => {
                    const charKey = `char_${hero}`;
                    mapData[hero] = {};

                    if (data.progressStore.map[charKey]) {
                        const charMaps = data.progressStore.map[charKey];
                        Object.keys(charMaps).forEach(mapKey => {
                            if (mapKey.startsWith('map:')) {
                                const mapName = mapKey.replace('map:', '');
                                const mapInfo = charMaps[mapKey];
                                mapData[hero][mapName] = {
                                    maxLevel: mapInfo.maxLevel || 0,
                                    totalKillCount: mapInfo.totalKillCount || 0,
                                    killCount: mapInfo.killCount || 0,
                                    furtherKillCount: mapInfo.furtherKillCount || 0,
                                    difficulty: mapInfo.difficulty || 0,
                                    distance: mapInfo.distance || 0
                                };
                            }
                        });
                    }
                });
            }
            return mapData;
        }

        function extractTotalKills(data) {
            const kills = {};
            if (data.progressStore && data.progressStore.kill && data.progressStore.kill.byCharacter) {
                heroes.forEach(hero => {
                    const charKey = `char_${hero}`;
                    kills[hero] = data.progressStore.kill.byCharacter[charKey] || 0;
                });
            }
            return kills;
        }

        function extractKillStats(data) {
            const killStats = {
                byMob: {},
                total: 0
            };

            if (data.progressStore && data.progressStore.kill) {
                const killData = data.progressStore.kill;

                // Extract kills by mob
                if (killData.byMob) {
                    killStats.byMob = killData.byMob;
                }

                // Extract total
                if (killData.total) {
                    killStats.total = killData.total;
                }
            }

            return killStats;
        }

        function getHeroIcon(heroName) {
            // Avatar sprite positions (from left to right in avatars.png)
            // Each character is approximately 32x32 pixels
            const positions = {
                'edric': 1,      // Warrior (2nd sprite)
                'serewyn': 2,    // Archer (3rd sprite)
                'corin': 3,      // Rogue (4th sprite)
                'alaric': 4      // Wizard (5th sprite)
            };
            const pos = positions[heroName.toLowerCase()] || 0;
            return `<img src="assets/avatars.png" class="hero-icon" style="object-fit: none; object-position: -${pos * 32}px 0; width: 32px; height: 32px;">`;
        }

        function getMapIcon(mapName) {
            const maps = {
                'forest': 'forest.png',
                'desert': 'desert.png',
                'jungle': 'jungle.png',
                'water': 'water.png',
                'village': 'village.png',
                'graveyard': 'graveyard.png',
                'swamp': 'swamp.png',
                'castle': 'castle.png',
                'dungeon': 'dungeon.png',
                'cave': 'cave.png',
                'snow': 'snow.png'
            };
            const mapFile = maps[mapName.toLowerCase()];
            if (mapFile) {
                return `<img src="assets/${mapFile}" class="map-icon" alt="${mapName}">`;
            }
            return '🗺️';
        }

        function displayResults(levels, mapData, totalKills, killStats, prevLevels = null, prevMapData = null, prevTotalKills = null) {
            // Display character overview with level, location, and kills
            const levelsGrid = document.getElementById('levelsGrid');
            levelsGrid.innerHTML = '';
            heroes.forEach(hero => {
                const heroName = hero.charAt(0).toUpperCase() + hero.slice(1);
                const heroData = levels[hero] || { level: 0, location: 'Unknown' };
                const level = heroData.level || 0;
                const location = heroData.location || 'Unknown';
                const kills = totalKills[hero] || 0;

                const prevLevel = prevLevels ? (prevLevels[hero]?.level || 0) : null;
                const prevKills = prevTotalKills ? (prevTotalKills[hero] || 0) : null;

                // Clean up location (remove "map:" prefix and capitalize)
                const mapName = location.replace('map:', '')
                    .split('_')
                    .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                    .join(' ');

                const heroIcon = getHeroIcon(hero);
                const mapIcon = getMapIcon(location.replace('map:', ''));

                const levelDisplay = formatComparisonValue(level, prevLevel);
                const killsDisplay = formatComparisonValue(kills, prevKills);

                levelsGrid.innerHTML += `
                    <div class="stat-card">
                        ${heroIcon}
                        <h3>${heroName}</h3>
                        <div class="value">Level ${levelDisplay}</div>
                        <div style="font-size: 0.9em; opacity: 0.9; margin-top: 8px;">${mapIcon} ${mapName}</div>
                        <div style="font-size: 0.9em; opacity: 0.9; margin-top: 5px;">⚔️ ${killsDisplay} kills</div>
                    </div>
                `;
            });

            // Get all unique maps
            const allMaps = new Set();
            Object.values(mapData).forEach(heroMaps => {
                Object.keys(heroMaps).forEach(map => allMaps.add(map));
            });

            // Define custom map order
            const mapOrder = ['forest', 'desert', 'jungle', 'water', 'village', 'graveyard',
                             'swamp', 'castle', 'dungeon', 'cave', 'inferno', 'snow', 'mountain'];

            // Filter maps with at least one kill, maintain custom order
            const mapsWithKills = [];

            // First add maps in the defined order
            mapOrder.forEach(mapName => {
                if (allMaps.has(mapName)) {
                    const hasKills = heroes.some(hero => {
                        return mapData[hero][mapName] && mapData[hero][mapName].totalKillCount > 0;
                    });
                    if (hasKills) {
                        mapsWithKills.push(mapName);
                    }
                }
            });

            // Then add any maps not in the predefined order (in case new maps exist)
            Array.from(allMaps).sort().forEach(mapName => {
                if (!mapOrder.includes(mapName)) {
                    const hasKills = heroes.some(hero => {
                        return mapData[hero][mapName] && mapData[hero][mapName].totalKillCount > 0;
                    });
                    if (hasKills) {
                        mapsWithKills.push(mapName);
                    }
                }
            });

            // Build table
            const tableHead = document.getElementById('tableHead');
            const tableBody = document.getElementById('tableBody');

            // Create header
            let headerHTML = '<tr><th class="map-header">Map</th>';
            heroes.forEach(hero => {
                const heroName = hero.charAt(0).toUpperCase() + hero.slice(1);
                headerHTML += `
                    <th class="hero-group">${heroName} Lvl</th>
                    <th class="kills-col">${heroName} Kills</th>
                `;
            });
            headerHTML += '</tr>';
            tableHead.innerHTML = headerHTML;

            // Create rows
            let bodyHTML = '';
            mapsWithKills.forEach(mapName => {
                const mapNameCap = mapName.charAt(0).toUpperCase() + mapName.slice(1);
                const mapIcon = getMapIcon(mapName);
                let row = `<tr><td class="map-name"><a href="#" class="map-link" onclick="showMapDetails('${mapName}'); return false;">${mapIcon} ${mapNameCap}</a></td>`;

                heroes.forEach(hero => {
                    if (mapData[hero][mapName]) {
                        const maxLevel = mapData[hero][mapName].maxLevel;
                        const kills = mapData[hero][mapName].totalKillCount;

                        const prevLevel = prevMapData && prevMapData[hero] && prevMapData[hero][mapName]
                            ? prevMapData[hero][mapName].maxLevel : null;
                        const prevKills = prevMapData && prevMapData[hero] && prevMapData[hero][mapName]
                            ? prevMapData[hero][mapName].totalKillCount : null;

                        const levelDisplay = formatComparisonValue(maxLevel, prevLevel);
                        const killsDisplay = formatComparisonValue(kills, prevKills);

                        row += `
                            <td class="hero-group">${levelDisplay}</td>
                            <td class="kills-col">${killsDisplay}</td>
                        `;
                    } else {
                        row += `
                            <td class="hero-group">N/A</td>
                            <td class="kills-col">0</td>
                        `;
                    }
                });

                row += '</tr>';
                bodyHTML += row;
            });
            tableBody.innerHTML = bodyHTML;

            // Display kill statistics table
            displayKillStats(killStats, totalKills);
        }

        function getMobMap(mobKey) {
            // Map mobs to their respective maps based on naming patterns
            const mobName = mobKey.toLowerCase();

            if (mobName.includes('slime') || mobName.includes('twig') || mobName.includes('leshy') ||
                mobName.includes('wood_warrior') || mobName.includes('fungus') || mobName.includes('fum_g')) {
                return 'Forest';
            }
            if (mobName.includes('orc') || mobName.includes('scorpion') || mobName.includes('cobra') ||
                mobName.includes('serpent') || mobName.includes('mummy')) {
                return 'Desert';
            }
            if (mobName.includes('porcu') || mobName.includes('spider') || mobName.includes('plant') ||
                mobName.includes('panda') || mobName.includes('kong')) {
                return 'Jungle';
            }
            if (mobName.includes('crab') || mobName.includes('fish') || mobName.includes('turtle')) {
                return 'Water';
            }
            if (mobName.includes('swamp') || mobName.includes('frog')) {
                return 'Swamp';
            }
            if (mobName.includes('ghost') || mobName.includes('skeleton') || mobName.includes('zombie') ||
                mobName.includes('witch')) {
                return 'Graveyard';
            }
            if (mobName.includes('knight') || mobName.includes('guard') || mobName.includes('king')) {
                return 'Castle';
            }
            if (mobName.includes('bat') || mobName.includes('rat') || mobName.includes('goblin')) {
                return 'Dungeon';
            }

            return 'Other';
        }

        function displayKillStats(killStats, totalKills) {
            // Separate bosses and regular mobs
            const bosses = {};
            const regularMobs = {};

            Object.entries(killStats.byMob).forEach(([mobKey, kills]) => {
                if (mobKey.includes('boss_')) {
                    bosses[mobKey] = kills;
                } else {
                    regularMobs[mobKey] = kills;
                }
            });

            // Calculate category totals
            const regularTotal = Object.values(regularMobs).reduce((sum, kills) => sum + kills, 0);
            const bossTotal = Object.values(bosses).reduce((sum, kills) => sum + kills, 0);

            // Display regular mobs
            displayMobTable('Regular', regularMobs, regularTotal);

            // Display bosses
            displayMobTable('Bosses', bosses, bossTotal);
        }

        function displayMobTable(type, mobs, categoryTotal) {
            const headerId = type === 'Bosses' ? 'killStatsBossesHead' : 'killStatsRegularHead';
            const bodyId = type === 'Bosses' ? 'killStatsBossesBody' : 'killStatsRegularBody';

            const tableHead = document.getElementById(headerId);
            const tableBody = document.getElementById(bodyId);

            // Create header
            let headerHTML = '<tr><th class="map-header">Mob Type</th>';
            headerHTML += '<th>Total Kills</th>';
            headerHTML += '<th>Percentage</th>';
            headerHTML += '</tr>';
            tableHead.innerHTML = headerHTML;

            // Group mobs by map
            const mobsByMap = {};
            Object.entries(mobs).forEach(([mobKey, kills]) => {
                const map = getMobMap(mobKey);
                if (!mobsByMap[map]) {
                    mobsByMap[map] = [];
                }
                mobsByMap[map].push([mobKey, kills]);
            });

            // Sort maps in game order
            const mapOrder = ['Forest', 'Desert', 'Jungle', 'Water', 'Village', 'Graveyard',
                             'Swamp', 'Castle', 'Dungeon', 'Cave', 'Inferno', 'Snow', 'Mountain', 'Other'];

            // Create rows
            let bodyHTML = '';

            mapOrder.forEach(mapName => {
                if (mobsByMap[mapName]) {
                    // Add map separator row with icon
                    const mapIcon = getMapIcon(mapName.toLowerCase());
                    bodyHTML += `
                        <tr>
                            <td colspan="3" class="map-separator">${mapIcon} ${mapName}</td>
                        </tr>
                    `;

                    // Sort mobs within map by kill count
                    mobsByMap[mapName].sort((a, b) => b[1] - a[1]);

                    // Add mob rows
                    mobsByMap[mapName].forEach(([mobKey, kills]) => {
                        const mobName = mobKey.replace('mob:', '').replace('boss_', '').replace(/_/g, ' ')
                            .split(' ')
                            .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                            .join(' ');

                        const percentage = categoryTotal > 0
                            ? ((kills / categoryTotal) * 100).toFixed(1)
                            : 0;

                        bodyHTML += `
                            <tr>
                                <td class="map-name">${mobName}</td>
                                <td style="text-align: center;">${kills.toLocaleString()}</td>
                                <td style="text-align: center;">${percentage}%</td>
                            </tr>
                        `;
                    });
                }
            });

            // Add total row (always 100% now)
            bodyHTML += `
                <tr style="font-weight: bold; background: rgba(74, 124, 89, 0.1);">
                    <td class="map-name">TOTAL ${type.toUpperCase()}</td>
                    <td style="text-align: center;">${categoryTotal.toLocaleString()}</td>
                    <td style="text-align: center;">100.0%</td>
                </tr>
            `;

            tableBody.innerHTML = bodyHTML;
        }

        function capitalize(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }
    </script>
</body>
</html>
